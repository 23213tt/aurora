<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Aurora tray icon source</title>
    <style>
      html,
      body {
        margin: 0;
        width: 32px;
        height: 32px;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Source for build/tray.png (32x32, for HiDPI; Windows scales it to 16x16).
      Two arcs rather than three: at 16 logical pixels a third stroke turns to mush.
      White on transparent, which reads correctly on the dark Windows taskbar.
      Render with: npx vision html-screenshot scripts/tray.html --width 32 --height 32
    -->
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <path d="M4.5 15C9.5 8.5 22.5 8.5 27.5 15" stroke-width="3.2" />
        <path d="M10 23.5C13 19.8 19 19.8 22 23.5" stroke-width="3.2" />
      </g>
    </svg>
  </body>
</html>
