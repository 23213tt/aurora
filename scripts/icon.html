<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Aurora icon source</title>
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Source for build/icon.png, which electron-builder converts to .ico.
      Render with: npx vision html-screenshot build/icon.html --width 512 --height 512
      The three arcs are the same mark used in the app's title bar.
    -->
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="plate" x1="0" y1="0" x2="0.55" y2="1">
          <stop offset="0" stop-color="#1a212a" />
          <stop offset="0.55" stop-color="#0f1319" />
          <stop offset="1" stop-color="#07090c" />
        </linearGradient>
        <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#7ef0c0" />
          <stop offset="0.45" stop-color="#4fd1c5" />
          <stop offset="1" stop-color="#6f9dff" />
        </linearGradient>
        <radialGradient id="bloom" cx="0.5" cy="0.4" r="0.62">
          <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.4" />
          <stop offset="1" stop-color="#4fd1c5" stop-opacity="0" />
        </radialGradient>
      </defs>

      <rect width="512" height="512" rx="116" fill="url(#plate)" />
      <rect width="512" height="512" rx="116" fill="url(#bloom)" />

      <g fill="none" stroke="url(#ink)" stroke-linecap="round">
        <path d="M104 212C168 130 344 130 408 212" stroke-width="27" />
        <path d="M146 292C192 242 320 242 366 292" stroke-width="24" />
        <path d="M198 372C218 344 294 344 314 372" stroke-width="21" />
      </g>

      <!-- Inner hairline: gives the plate an edge on light and dark desktops. -->
      <rect
        x="1.5"
        y="1.5"
        width="509"
        height="509"
        rx="115"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.09"
        stroke-width="3"
      />
    </svg>
  </body>
</html>
